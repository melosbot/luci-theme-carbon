name: Deploy demo and package feed to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'preview/**'
      - 'htdocs/luci-static/carbon/**'
      - 'scripts/build-demo.py'
      - 'scripts/build-feed.py'
      - 'scripts/publish-feed.sh'
      - 'keys/**'
      - '.github/workflows/pages.yml'
      - 'LICENSE'
  pull_request:
    paths:
      - 'preview/**'
      - 'htdocs/luci-static/carbon/**'
      - 'scripts/build-demo.py'
      - 'scripts/build-feed.py'
      - 'scripts/publish-feed.sh'
      - 'keys/**'
      - '.github/workflows/pages.yml'
      - 'LICENSE'
  # The release job in build.yml dispatches this workflow so the feed follows
  # each release (releases created with GITHUB_TOKEN raise no release events).
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.ref || 'deploy' }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check JavaScript
        run: |
          node --check preview/mock.js
          node --check preview/demo.js
          node --check htdocs/luci-static/carbon/carbon.js
          node --check htdocs/luci-static/carbon/brands.js
          for f in htdocs/luci-static/carbon/i18n/*.js; do node --check "$f"; done
      - name: Build static demo
        run: python3 scripts/build-demo.py
      # opkg/apk feed at <pages>/feed/ from the latest release, signed and then
      # checked with real opkg/apk before deployment (see scripts/publish-feed.sh).
      - name: Build package feed
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          FEED_USIGN_KEY: ${{ secrets.FEED_USIGN_KEY }}
          APK_SIGNING_KEY: ${{ secrets.APK_SIGNING_KEY }}
        run: sh scripts/publish-feed.sh dist/demo/feed
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/demo

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
