name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing tag to build and publish (leave empty for build only)'
        type: string
        required: false
        default: ''

permissions:
  contents: read

env:
  RELEASE_TAG: ${{ inputs.release_tag || (startsWith(github.ref, 'refs/tags/v') && github.ref_name) || '' }}

jobs:
  # Lint + SDK-free artifacts: the universal install script and a plain .ipk
  package:
    name: Install script
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag && format('refs/tags/{0}', inputs.release_tag) || github.ref }}

      - name: Tag must match PKG_VERSION
        if: env.RELEASE_TAG != ''
        run: |
          ver=$(sed -n 's/^PKG_VERSION:=//p' Makefile)
          if [ "v$ver" != "$RELEASE_TAG" ]; then
            echo "::error::Tag $RELEASE_TAG does not match PKG_VERSION $ver in Makefile"
            exit 1
          fi

      - name: Lint
        run: |
          node --check htdocs/luci-static/carbon/carbon.js
          node --check htdocs/luci-static/carbon/brands.js
          node -e "new Function(require('fs').readFileSync('htdocs/luci-static/resources/menu-carbon.js', 'utf8'))"
          python3 -m json.tool root/usr/share/rpcd/acl.d/luci-theme-carbon.json > /dev/null
          for f in scripts/*.sh root/etc/uci-defaults/*; do sh -n "$f"; done

      - name: Build install script and .ipk
        run: |
          sh scripts/build-installer.sh dist
          sh scripts/build-ipk.sh dist-ipk

      - uses: actions/upload-artifact@v4
        with:
          name: installer
          path: dist/carbon-install.sh

      - uses: actions/upload-artifact@v4
        with:
          name: ipk-standalone
          path: dist-ipk/*.ipk

  # Official OpenWrt SDKs: 24.10 (opkg → .ipk) and 25.12 (apk → .apk)
  sdk:
    name: SDK ${{ matrix.sdk }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        sdk:
          # Release images include the SDK; the floating 24.10 snapshot
          # downloads it at runtime and can stall indefinitely on the mirror.
          - x86_64-24.10.8
          - x86_64-openwrt-25.12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag && format('refs/tags/{0}', inputs.release_tag) || github.ref }}
          path: feed/luci-theme-carbon

      - name: Check out SDK action
        uses: actions/checkout@v4
        with:
          repository: openwrt/gh-action-sdk
          ref: 7fc2640243284ecc44f4a9c3f749a61746ee02cb # v11
          path: sdk-action

      - name: Reuse SDK already present in release images
        run: |
          python3 - <<'PY'
          from pathlib import Path
          entrypoint = Path('sdk-action/entrypoint.sh')
          source = entrypoint.read_text()
          old = '[ ! -f setup.sh ] || bash setup.sh'
          # v11 reruns setup.sh even when a release image already has the SDK.
          # Keep upstream signature/checksum verification for snapshot images.
          new = '''if [ -f scripts/feeds ] && [ -d staging_dir ] && [ -f Makefile ]; then
            echo "Using SDK already installed in the container"
          else
            [ ! -f setup.sh ] || bash setup.sh
          fi'''
          if source.count(old) != 1:
              raise SystemExit('SDK action initialization changed; review the guard')
          entrypoint.write_text(source.replace(old, new))
          PY

      - name: Build with OpenWrt SDK
        timeout-minutes: 15
        uses: ./sdk-action
        env:
          ARCH: ${{ matrix.sdk }}
          FEED_DIR: ${{ github.workspace }}/feed
          FEEDNAME: carbon
          PACKAGES: luci-theme-carbon
          NO_REFRESH_CHECK: 1
          NO_SHFMT_CHECK: 1
          V: s

      - name: Collect package
        run: |
          mkdir -p out
          find bin -type f -name 'luci-theme-carbon*' \( -name '*.ipk' -o -name '*.apk' \) -exec cp {} out/ \;
          ls -la out
          [ -n "$(ls out)" ] || { echo "::error::no package produced"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: sdk-${{ matrix.sdk }}
          path: out/*

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    needs: [package, sdk]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Gather assets
        run: |
          mkdir -p assets
          cp artifacts/installer/carbon-install.sh assets/
          cp artifacts/sdk-*/* assets/
          ls -la assets

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<'EOF'
          ### Install

          | Firmware | File |
          |---|---|
          | Any (OpenWrt / ImmortalWrt 23.05+) | `carbon-install.sh` — `sh carbon-install.sh` |
          | 23.05 / 24.10 (opkg) | `luci-theme-carbon_*_all.ipk` — `opkg install …` or upload in LuCI |
          | 25.x / snapshot (apk) | `luci-theme-carbon-*.apk` — `apk add --allow-untrusted …` |

          One-liner on the router:

          ```sh
          wget -O /tmp/carbon-install.sh https://github.com/${{ github.repository }}/releases/latest/download/carbon-install.sh && sh /tmp/carbon-install.sh
          ```

          Log out and back in once after installing.
          EOF
          gh release create "$RELEASE_TAG" assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "Carbon $RELEASE_TAG" \
            --notes-file notes.md \
            --generate-notes
